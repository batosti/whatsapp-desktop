# Builds the snap on every push and pull request; publishes to the Snap Store only on pushes to main.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Whatsapp Electron CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Use Node.js 26.x
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 26.x
        cache: 'npm'
    - run: npm ci
    - run: npm audit --audit-level=high
    - uses: canonical/setup-lxd@8c6a87bfb56aa48f3fb9b830baa18562d8bfd4ee # v1
      with:
        channel: latest/stable
    - run: sudo snap install snapcraft --classic
    - name: build snap
      run: npm run dist
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: snap
        path: dist/*.snap
        if-no-files-found: error

  publish:

    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    environment: snap
    concurrency:
      group: snap-publish
      cancel-in-progress: false

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Use Node.js 26.x
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 26.x
        cache: 'npm'
    - run: npm ci
    - uses: canonical/setup-lxd@8c6a87bfb56aa48f3fb9b830baa18562d8bfd4ee # v1
      with:
        channel: latest/stable
    - run: sudo snap install snapcraft --classic
    - name: build and upload to snap
      env:
        SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAP_LOGIN }}
      run: npm run publish
